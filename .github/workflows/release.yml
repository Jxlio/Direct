name: Build and prepare release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure and build
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test free rendezvous service
        working-directory: service
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx wrangler deploy --dry-run
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package portable application
        run: ./scripts/package_windows.ps1
      - name: Install signing dependency
        if: startsWith(github.ref, 'refs/tags/')
        run: python -m pip install cryptography==46.0.3
      - name: Sign update assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIRECT_UPDATE_SIGNING_KEY: ${{ secrets.DIRECT_UPDATE_SIGNING_KEY }}
        run: |
          $projectText = Get-Content CMakeLists.txt -Raw
          $version = [regex]::Match($projectText, 'project\(Murmur VERSION ([0-9.]+)').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and application version differ" }
          if (!$env:DIRECT_UPDATE_SIGNING_KEY) { throw "Configure DIRECT_UPDATE_SIGNING_KEY before creating a release" }
          $signingFile = Join-Path $env:RUNNER_TEMP 'direct-signing.pem'
          try {
            [IO.File]::WriteAllText($signingFile, $env:DIRECT_UPDATE_SIGNING_KEY)
            python scripts/sign_update.py --version $version --exe build/Release/Direct.exe --key $signingFile --output out/release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $signingFile -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Direct-Windows-x64
          path: |
            out/release/*.zip
            out/release/Direct-win-x64.*
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem out/release -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -like 'Direct-win-x64.*' } | ForEach-Object { $_.FullName }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '[^\r\n]*\r?\n(.*?)(?=^## |\z)'
          $notes = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
          if (!$notes.Success) { throw "Release notes missing for $version" }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes.Groups[1].Value.Trim())
          gh release create "$env:GITHUB_REF_NAME" --draft --verify-tag --title "Direct $env:GITHUB_REF_NAME" --notes-file $notesPath @assets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
